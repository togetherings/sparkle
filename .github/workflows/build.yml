# Checks Sparkle, builds its zips and plays it in a real Kolibri, every time something is pushed.
# The kit's steps are EduGame Kit's (its game.yml workflow), at the kit release named after "@":
# Dependabot (.github/dependabot.yml) opens a pull request here when a new kit release comes out,
# and these checks run on it. Sparkle's own browser tests use that same kit release.
#
#   * Every push: the zips are in the run's "Artifacts" (Actions tab > the run > game-zips).
#     Screenshots are in "kolibri-screenshots", "browser-screenshots" and "games-page-screenshots".
#   * Publish a release (Releases > Draft a new release, with a tag like v0.2.0 that matches
#     "version" in game/edugame.json): the zips are attached to it.
name: Build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write      # only used to attach the zips to a release

jobs:
  kit:
    name: Kit
    uses: togetherings/edugame-kit/.github/workflows/game.yml@v0.3.1
    with:
      folder: game
      tests: node --test tests/*.test.js

  # Plays Sparkle in the kit's test page (as Kolibri Learn runs it), in English and French.
  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the kit (the release the Kit job uses) and a browser
        run: |
          KIT_REF="$(grep -o 'game.yml@v[0-9.]*' .github/workflows/build.yml | head -1 | cut -d@ -f2)"
          pip install playwright "edugame-kit @ git+https://github.com/togetherings/edugame-kit@$KIT_REF"
          python -m playwright install --with-deps chromium
      - name: Play Sparkle in the kit's test page
        run: python tests/browser_test.py --screenshots browser-screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-screenshots
          path: browser-screenshots
          if-no-files-found: ignore

  # Plays Sparkle on the Kolibri Games games page: attempts, and a scoreboard for each language.
  games-page:
    name: Games page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the kit, Kolibri Games and a browser
        run: |
          KIT_REF="$(grep -o 'game.yml@v[0-9.]*' .github/workflows/build.yml | head -1 | cut -d@ -f2)"
          pip install playwright "edugame-kit @ git+https://github.com/togetherings/edugame-kit@$KIT_REF" \
            git+https://github.com/togetherings/kolibri-games
          python -m playwright install --with-deps chromium
      - name: Play Sparkle on the games page
        run: python tests/games_page_test.py --screenshots games-page-screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: games-page-screenshots
          path: games-page-screenshots
          if-no-files-found: ignore

  # The one check the "Protect main" ruleset requires in every togetherings repository: it passes only when
  # every job above passed, so tests can be added or renamed without changing the ruleset. Add new jobs to "needs".
  checks-passed:
    name: Checks passed
    if: always()
    needs: [kit, browser, games-page]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
